<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreelanceHub - Find work. Hire talent.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md fh-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#" onclick="showView('home');return false">FreelanceHub</a>
    <div class="ms-auto d-flex gap-2 align-items-center" id="navRight"></div>
  </div>
</nav>

<header class="fh-hero">
  <div class="container">
    <h1>Small jobs. Real people. Done well.</h1>
    <p>Clients post a gig. Freelancers send a proposal. One click to hire.</p>
    <div class="row g-2 fh-search">
      <div class="col-md-6"><input id="q" class="form-control" placeholder="Search gigs, e.g. logo, data entry, website"></div>
      <div class="col-md-4">
        <select id="cat" class="form-select">
          <option value="">All categories</option>
          <option>Design</option><option>Web Development</option><option>Data Entry</option>
          <option>Writing</option><option>Documents &amp; Presentations</option><option>Other</option>
        </select>
      </div>
      <div class="col-md-2 d-grid"><button class="btn btn-fh" onclick="loadGigs()">Search</button></div>
    </div>
  </div>
</header>

<main class="container my-4">
  <div id="alertBox"></div>
  <section id="view-browse"><div id="gigList" class="row g-3"></div></section>
  <section id="view-dash" class="d-none"></section>
  <section id="view-post" class="d-none">
    <div class="card fh-card"><div class="card-body">
      <h4 class="mb-3">Post a gig</h4>
      <div class="mb-3"><label class="form-label">Title</label><input id="g_title" class="form-control" placeholder="Design a logo for my bakery"></div>
      <div class="mb-3"><label class="form-label">Description</label><textarea id="g_desc" rows="4" class="form-control" placeholder="What do you need, and by when?"></textarea></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Category</label>
          <select id="g_cat" class="form-select"><option>Design</option><option>Web Development</option><option>Data Entry</option><option>Writing</option><option>Documents &amp; Presentations</option><option>Other</option></select></div>
        <div class="col-md-6"><label class="form-label">Budget (Rs.)</label><input id="g_budget" type="number" min="1" class="form-control"></div>
      </div>
      <button class="btn btn-fh mt-3" onclick="postGig()">Post gig</button>
    </div></div>
  </section>
</main>
<footer class="app-footer">
  <div class="container">
    FreelanceHub<span class="sep">|</span>Developed by <strong>Khuman Ritu</strong>
  </div>
</footer>

<!-- Login / Register -->
<div class="modal fade" id="authModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="authTitle">Log in</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="authAlert"></div>
    <div id="regOnly" class="d-none">
      <div class="mb-3"><label class="form-label">Full name</label><input id="a_name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">I want to</label>
        <select id="a_role" class="form-select"><option value="freelancer">Find work (freelancer)</option><option value="client">Hire people (client)</option></select></div>
      <div class="mb-3"><label class="form-label">Skills (optional)</label><input id="a_skills" class="form-control" placeholder="Canva, Word, data entry"></div>
    </div>
    <div class="mb-3"><label class="form-label">Email</label><input id="a_email" type="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="a_pass" type="password" class="form-control"></div>
    <button class="btn btn-fh w-100" id="authBtn" onclick="submitAuth()">Log in</button>
    <p class="text-center mt-3 mb-0"><a href="#" id="authSwitch" onclick="toggleAuth();return false">New here? Create an account</a></p>
  </div>
</div></div></div>

<!-- Send proposal -->
<div class="modal fade" id="propModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Send proposal</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="propAlert"></div>
    <input type="hidden" id="p_gig">
    <div class="mb-3"><label class="form-label">Your price (Rs.)</label><input id="p_price" type="number" min="1" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Why are you a good fit?</label><textarea id="p_msg" rows="4" class="form-control"></textarea></div>
    <button class="btn btn-fh w-100" onclick="sendProposal()">Send proposal</button>
  </div>
</div></div></div>

<!-- Proposals list (client) -->
<div class="modal fade" id="listModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Proposals</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="listBody"></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script src="site.js"></script>
</body>
</html>
